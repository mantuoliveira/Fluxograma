<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Editor didático de fluxogramas com execução passo a passo.">
  <title>Fluxo — Laboratório de Lógica</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23192a3d'/%3E%3Ccircle cx='20' cy='18' r='7' fill='%235be0b1'/%3E%3Cpath d='M20 25v12h24M37 30l7 7-7 7' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260918-branch-labels-v10">
</head>
<body>
  <main class="app-shell">
    <aside class="palette panel" id="palette" aria-label="Paleta de blocos">
      <div class="panel-heading">
        <span class="eyebrow">BLOCOS</span>
        <span class="count" id="blockCount">0</span>
      </div>
      <div class="block-tools">
        <button class="tool-card" data-add="start" type="button">
          <span class="tool-symbol pill-symbol">INÍCIO</span>
          <span><strong>Início</strong></span>
        </button>
        <button class="tool-card" data-add="assignment" type="button">
          <span class="tool-symbol rect-symbol">x←</span>
          <span><strong>Ação</strong></span>
        </button>
        <button class="tool-card" data-add="call" type="button">
          <span class="tool-symbol rect-symbol call-symbol" aria-hidden="true"></span>
          <span><strong>Chamada</strong></span>
        </button>
        <button class="tool-card" data-add="decision" type="button">
          <span class="tool-symbol diamond-symbol"><i>?</i></span>
          <span><strong>Decisão</strong></span>
        </button>
        <button class="tool-card" data-add="end" type="button">
          <span class="tool-symbol pill-symbol end-symbol">FIM</span>
          <span><strong>Fim</strong></span>
        </button>
      </div>
    </aside>

    <section class="workspace panel" aria-label="Editor de fluxograma">
      <div class="workspace-bar">
        <div>
          <button class="icon-button palette-toggle" id="togglePalette" type="button" aria-expanded="true" aria-label="Recolher blocos" title="Recolher blocos"><svg class="palette-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6.5-5.5 5.5 5.5 5.5"/></svg></button>
          <span class="eyebrow">FLUXOGRAMA</span>
        </div>
        <div class="workspace-actions">
          <div class="file-actions" aria-label="Arquivo">
            <button class="icon-button" id="newFlow" type="button" aria-label="Novo fluxograma" title="Novo fluxograma">＋</button>
            <button class="icon-button" id="saveFlow" type="button" aria-label="Salvar como JSON" title="Salvar como JSON"><svg class="file-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M7.5 11.5 12 16l4.5-4.5M5 21h14"/></svg></button>
            <button class="icon-button" id="loadFlow" type="button" aria-label="Abrir arquivo JSON" title="Abrir arquivo JSON"><svg class="file-icon upload-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13M7.5 11.5 12 16l4.5-4.5M5 21h14"/></svg></button>
            <input id="fileInput" type="file" accept="application/json,.json" hidden>
          </div>
          <div class="canvas-actions">
            <button class="icon-button" id="deleteSelected" type="button" disabled aria-label="Excluir item selecionado" title="Excluir item selecionado">⌫</button>
            <button class="button reset icon-action" id="resetRun" type="button" aria-label="Reiniciar execução" title="Reiniciar execução"><svg class="action-icon reset-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="button step icon-action" id="stepRun" type="button" aria-label="Executar próximo passo" title="Executar próximo passo"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 9 7-9 7V5ZM18 5v14"/></svg></button>
          </div>
          <button class="icon-button history-toggle" id="toggleHistory" type="button" aria-expanded="true" aria-label="Recolher rastreamento" title="Recolher rastreamento"><svg class="history-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></svg></button>
        </div>
      </div>
      <div id="canvas" class="canvas" tabindex="0" aria-label="Canvas do fluxograma">
        <div class="grid-dots" aria-hidden="true"></div>
        <svg id="connections" class="connections" aria-hidden="true"></svg>
        <div id="emptyState" class="empty-state">
          <span class="empty-icon" aria-hidden="true">⌁</span>
          <strong>Comece pelo bloco Início</strong>
        </div>
      </div>
    </section>

    <div class="history-resize" id="historyResize" role="separator" aria-label="Redimensionar histórico" aria-orientation="vertical" aria-valuemin="250" aria-valuemax="1200" aria-valuenow="440" tabindex="0" title="Arraste para redimensionar o histórico">
      <span aria-hidden="true"></span>
    </div>

    <section class="history panel" aria-label="Histórico de execução">
      <div class="history-heading">
        <div>
          <span class="eyebrow">RASTREAMENTO DE VARIÁVEIS</span>
          <span id="runBadge" class="run-badge">NÃO INICIADO</span>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="historyHead"><tr><th>Passo</th><th>Bloco executado</th></tr></thead>
          <tbody id="historyBody"><tr class="blank-row"><td colspan="2">Clique em <strong>Passo</strong> para iniciar a execução.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260918-branch-labels-v10"></script>
</body>
</html>
